<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弁当発注アプリ</title>
<style>
  :root{
    --main:#f0913f; --main-dark:#cc7328; --bg:#ffffff; --card:#ffffff;
    --border:#ffe3c2; --text:#333; --sub:#948a7e; --ok:#3a8b4a; --lock:#b0453a;
  }
  *{box-sizing:border-box;}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:0;}
  header{background:var(--main);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  header h1{font-size:18px;margin:0;}
  header .clock{font-size:12px;opacity:.9;}
  nav{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;}
  nav button{background:none;border:none;padding:12px 18px;font-size:14px;cursor:pointer;color:var(--sub);white-space:nowrap;border-bottom:3px solid transparent;}
  nav button.active{color:var(--main-dark);border-bottom:3px solid var(--main);font-weight:bold;}
  main{max-width:820px;margin:0 auto;padding:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;}
  .card h2{font-size:16px;margin:0 0 12px;color:var(--main-dark);}
  label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px;margin-top:10px;}
  select,input[type=date],input[type=text],input[type=number],input[type=time],input[type=file],input[type=month]{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;background:#fff;
  }
  .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px;}
  .menu-item{border:2px solid var(--border);border-radius:8px;padding:10px;text-align:center;cursor:pointer;background:#fff;}
  .menu-item.selected{border-color:var(--main);background:#fff1e0;}
  .menu-item .name{font-weight:bold;font-size:14px;}
  .menu-item .price{font-size:12px;color:var(--sub);margin-top:4px;}
  button.primary{background:var(--main);color:#fff;border:none;padding:11px 20px;border-radius:6px;font-size:15px;cursor:pointer;margin-top:14px;}
  button.primary:disabled{background:#ccc;cursor:not-allowed;}
  button.secondary{background:#fff;color:var(--main-dark);border:1px solid var(--main);padding:8px 14px;border-radius:6px;font-size:13px;cursor:pointer;}
  button.danger{background:#fff;color:var(--lock);border:1px solid var(--lock);padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer;}
  button.small{padding:6px 10px;font-size:12px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;}
  .status-box{padding:10px 12px;border-radius:6px;font-size:13px;margin-top:10px;}
  .status-ok{background:#eaf6ec;color:var(--ok);border:1px solid #c7e7cc;}
  .status-lock{background:#fbebe9;color:var(--lock);border:1px solid #f0c9c4;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  th,td{border:1px solid var(--border);padding:7px 8px;text-align:left;}
  th{background:#fff1e0;}
  .table-scroll{max-height:60vh;overflow-y:auto;overflow-x:auto;border:1px solid var(--border);border-radius:8px;margin-top:8px;}
  .table-scroll table{margin-top:0;}
  .table-scroll th{position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--border);}
  @media print{ .table-scroll{max-height:none;overflow:visible;} .table-scroll th{position:static;} }
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .subtabs button{padding:7px 12px;font-size:13px;border:1px solid var(--border);background:#fff;border-radius:16px;cursor:pointer;color:var(--sub);}
  .subtabs button.active{background:var(--main);color:#fff;border-color:var(--main);}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .row > *{flex:1;min-width:100px;}
  .hint{font-size:12px;color:var(--sub);margin-top:6px;}
  .checkbox-col{width:34px;text-align:center;}
  .checkbox-box{display:inline-block;width:16px;height:16px;border:1.5px solid #333;}
  .total-row{font-weight:bold;background:#fff1e0;}
  .row-holiday td{background:#eeeeee;color:#999;}
  .row-today td{background:#fff1e0;font-weight:bold;box-shadow:inset 0 2px 0 var(--main), inset 0 -2px 0 var(--main);}
  .row-today.row-holiday td{background:#e9e2da;}
  .today-badge{display:inline-block;background:var(--main);color:#fff;font-size:10px;font-weight:bold;padding:1px 6px;border-radius:10px;margin-left:6px;vertical-align:middle;}
  .weekday-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .weekday-grid label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text);margin:0;width:auto;}
  .weekday-grid input{width:auto;}
  .receipt-table th,.receipt-table td{padding:2px 8px;font-size:12px;line-height:1.3;}
  .receipt-table .checkbox-box{width:12px;height:12px;}
  .receipt-table th.date-col,.receipt-table td.date-col{width:90px;}
  .receipt-table .dept-group-row td{background:#fff1e0;color:var(--main-dark);font-weight:bold;font-size:12px;padding:3px 8px;}
  .receipt-table tr:nth-child(even) td{background:#f2f6fb;}
  .receipt-page h2{margin:0 0 6px;}
  #faxSheetHolder{display:none;}
  .fax-sheet{width:100%;padding:20px;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;}
  .fax-sheet h1{font-size:28px;text-align:center;border-bottom:3px solid #333;padding-bottom:14px;margin:0 0 26px;letter-spacing:4px;}
  .fax-sheet .fax-menu-name{text-align:center;margin:0 0 30px;padding:14px;border:2px solid #333;}
  .fax-sheet .fax-menu-name .fax-menu-line{font-size:20px;font-weight:bold;}
  .fax-sheet .fax-menu-name .fax-title-line{font-size:34px;font-weight:bold;margin-top:8px;letter-spacing:6px;}
  .fax-info-table{width:100%;border-collapse:collapse;font-size:16px;}
  .fax-info-table th{width:150px;text-align:left;background:#f5f5f5;padding:12px 14px;border:1px solid #999;}
  .fax-info-table td{padding:12px 14px;border:1px solid #999;}
  .fax-info-table tr.fax-emphasis-row th,
  .fax-info-table tr.fax-emphasis-row td{font-size:28px;font-weight:bold;}
  .blink-alert{
    color:#c0392b;font-weight:bold;font-size:16px;margin-top:10px;
    padding:10px 14px;border:2px solid #c0392b;border-radius:6px;background:#ffe3e3;
    animation: blinkAlert 1s infinite;
  }
  @keyframes blinkAlert{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .monthly-table td, .monthly-table th{ white-space:nowrap; }
  @page{ size: A4; margin: 18mm; }
  @media print{
    header, nav, .no-print{display:none !important;}
    body{background:#fff;}
    main{max-width:100%;padding:0;}
    .card{border:none;box-shadow:none;}
    .receipt-table th,.receipt-table td{padding:1px 6px;font-size:13px;line-height:1.15;}
    .receipt-table .dept-group-row td{padding:2px 6px;}
    .receipt-table tr:nth-child(even) td{background:#eef1f4 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    body.printing-fax > *:not(#faxSheetHolder){display:none !important;}
    body.printing-fax #faxSheetHolder{display:block;}
    .receipt-page{ page-break-after: always; }
    .receipt-page:last-child{ page-break-after: auto; }
    .fax-page{ page-break-after: always; }
    .fax-page:last-child{ page-break-after: auto; }
  }
</style>
</head>

async function sbRequest(path, options){
  options = options || {};
  let res;
  try{
    res = await fetch(SUPABASE_URL + path, {
      method: options.method || "GET",
      headers: Object.assign({
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json"
      }, options.headers || {}),
      body: options.body
    });
  }catch(networkErr){
    throw new Error("サーバーに接続できません。しばらくしてから再度お試しください（プロジェクトが一時停止している可能性もあります）。");
  }
  let data = null;
  const text = await res.text();
  if(text){
    try{ data = JSON.parse(text); }catch(e){ data = text; }
  }
  if(!res.ok){
    const err = new Error((data && data.message) ? data.message : ("通信エラー（HTTP " + res.status + "）"));
    err.code = data && data.code;
    throw err;
  }
  return data;
}

function sbSelect(table, query){
  return sbRequest("/rest/v1/" + table + "?select=*" + (query ? ("&" + query) : ""));
}

function sbRpc(fn, params){
  return sbRequest("/rest/v1/rpc/" + fn, {method:"POST", body: JSON.stringify(params || {})});
}

  if(e.code === "23505") return "その値は既に使用されています（重複）。";

const SESSION_STORAGE_KEY = "bentoAppSession_v1";
let session = null; // { token, employeeId, name, dept, isAdmin, employeeType, code }

function loadStoredSession(){
  try{
    const raw = localStorage.getItem(SESSION_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function persistSession(){
  if(session) localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(session));
  else localStorage.removeItem(SESSION_STORAGE_KEY);
}

async function loginWithCode(code){
  const trimmed = (code||"").trim();
  if(!trimmed){ loginError = "社員CDを入力してください"; return false; }
  const rows = await sbRpc("rpc_login", {p_code: trimmed});
  if(!rows || rows.length === 0){
    loginError = "該当する社員CDが見つかりません";
    return false;
  }
  const r = rows[0];
  session = { token: r.session_token, employeeId: r.employee_id, name: r.name, dept: r.dept, isAdmin: r.is_admin, employeeType: r.employee_type || "employee", code: trimmed };
  persistSession();
  loginError = "";
  return true;
}

async function logout(){
  if(session){
    try{ await sbRpc("rpc_logout", {p_token: session.token}); }catch(e){ /* ベストエフォート */ }
  }
  session = null;
  persistSession();
  state.orders = {};
  state.employees = [];
}

    p_blocked_weekdays: payload.blockedWeekdays
  });
  state.deadline = { daysBefore: updated.deadline_days_before, time: updated.deadline_time };
  state.blockedDates = updated.blocked_dates || [];
  state.blockedWeekdays = updated.blocked_weekdays || [];
}

// 発注月度（21日始まり20日締め）に対応した本人の発注情報を取得する
// state.orders[date][employeeId] は { menuId, qty } の形で保持する（qtyはまれな複数個発注に対応するため）
async function loadMyOrdersForMonth(periodYm){
  const {start, end} = periodRange(periodYm);
  const rows = await sbRpc("rpc_get_my_orders_range", {p_token: session.token, p_start_date: start, p_end_date: end});
  datesInPeriod(periodYm).forEach(d=>{ if(state.orders[d]) delete state.orders[d][session.employeeId]; });
  rows.forEach(r=>{
    if(!state.orders[r.date]) state.orders[r.date] = {};
    state.orders[r.date][session.employeeId] = { menuId: r.menu_id, qty: r.qty || 1 };
  });
  // その月度に登録済みの献立PDF一覧（メニューごと）も一緒に取得しておく
  try{
    state.menuPdfsForMonth = await sbRpc("rpc_get_menu_pdfs_for_month", {p_token: session.token, p_ym: periodYm});
  }catch(e){
    state.menuPdfsForMonth = [];
  }
}

// 管理者による代理発注用: 指定した社員の、指定した発注月度の発注情報を取得する（同じstate.ordersキャッシュに格納する）
async function loadProxyOrdersForPeriod(employeeId, periodYm){
  const {start, end} = periodRange(periodYm);

/* ===================== ユーティリティ ===================== */
function dayOfWeek(dateStr){
  return new Date(dateStr+"T00:00:00").getDay(); // 0:日 ... 6:土
}

function isBlockedDate(dateStr){
  return (state.blockedDates||[]).includes(dateStr);
}

function isBlockedWeekday(dateStr){
  return (state.blockedWeekdays||[]).includes(dayOfWeek(dateStr));
}

function holidayName(dateStr){
  return HOLIDAYS[dateStr] || null;
}

function isNonOrderableDay(dateStr){
  return isBlockedDate(dateStr) || isBlockedWeekday(dateStr) || !!holidayName(dateStr);
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function fmtDateJP(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const days = ["日","月","火","水","木","金","土"];
  return `${d.getMonth()+1}月${d.getDate()}日(${days[d.getDay()]})`;
}

// 指定した発注対象日の締切日時を計算
function getDeadline(dateStr){
  const target = new Date(dateStr+"T00:00:00");
  target.setDate(target.getDate() - (state.deadline.daysBefore||0));
  const [hh,mm] = (state.deadline.time||"15:00").split(":").map(Number);
  target.setHours(hh, mm, 0, 0);
  return target;
}

function isLocked(dateStr){
  return new Date() > getDeadline(dateStr);
}

function fmtDeadline(dateStr){
  const dl = getDeadline(dateStr);
  return `${dl.getMonth()+1}/${dl.getDate()} ${String(dl.getHours()).padStart(2,"0")}:${String(dl.getMinutes()).padStart(2,"0")}`;
}

function shiftMonth(ym, delta){
  let [y,m] = ym.split("-").map(Number);
  m += delta;
  while(m>12){ m-=12; y++; }
  while(m<1){ m+=12; y--; }
  return `${y}-${String(m).padStart(2,"0")}`;
}

function daysInMonth(ym){
  const [y,m] = ym.split("-").map(Number);
  const last = new Date(y, m, 0).getDate();
  return Array.from({length:last}, (_,i)=> `${y}-${String(m).padStart(2,"0")}-${String(i+1).padStart(2,"0")}`);
}

// 発注月度: "YYYY-MM"（例: "2026-08" = 8月度）は「前月21日〜当月20日」を表す
function periodRange(ym){
  let [y,m] = ym.split("-").map(Number);
  let sy = y, sm = m - 1;
  if(sm < 1){ sm = 12; sy--; }
  const start = `${sy}-${String(sm).padStart(2,"0")}-21`;
  const end = `${y}-${String(m).padStart(2,"0")}-20`;
  return { start, end };
}

function datesInRange(startStr, endStr){
  const dates = [];
  let cur = new Date(startStr+"T00:00:00");
  const end = new Date(endStr+"T00:00:00");
  while(cur <= end){
    dates.push(`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,"0")}-${String(cur.getDate()).padStart(2,"0")}`);
    cur.setDate(cur.getDate()+1);
  }
  return dates;
}

function datesInPeriod(ym){
  const {start, end} = periodRange(ym);
  return datesInRange(start, end);
}

// 指定日が属する発注月度のラベル（"YYYY-MM"）を返す（21日以降ならその月の翌月扱い）
function periodLabelFor(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  let y = d.getFullYear(), m = d.getMonth()+1;
  if(d.getDate() >= 21){
    m += 1;
    if(m > 12){ m = 1; y++; }
  }
  return `${y}-${String(m).padStart(2,"0")}`;
}

function existingMenuFor(empId, dateStr){
  const o = state.orders[dateStr] && state.orders[dateStr][empId];
  return o ? o.menuId : null;
}

function existingQtyFor(empId, dateStr){
  const o = state.orders[dateStr] && state.orders[dateStr][empId];
  return o ? (o.qty || 1) : 1;
}

function downloadFile(filename, content){
  const blob = new Blob(["﻿"+content], {type:"text/csv;charset=utf-8"});
  downloadBlob(filename, blob);
}

function downloadBlob(filename, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// 献立PDF（月別）: ファイル→base64 への変換と、base64→新規タブでのPDF表示を共通化する
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      // reader.result は "data:application/pdf;base64,xxxx" 形式なので、カンマ以降のbase64部分だけ取り出す
      const result = reader.result || "";
      const comma = result.indexOf(",");
      resolve(comma >= 0 ? result.slice(comma + 1) : result);
    };
    reader.onerror = ()=> reject(reader.error);
    reader.readAsDataURL(file);
  });
}

function openPdfFromBase64(base64){
  const byteChars = atob(base64);
  const byteNumbers = new Array(byteChars.length);
  for(let i=0;i<byteChars.length;i++) byteNumbers[i] = byteChars.charCodeAt(i);
  const byteArray = new Uint8Array(byteNumbers);
  const blob = new Blob([byteArray], {type:"application/pdf"});
  const url = URL.createObjectURL(blob);
  window.open(url, "_blank");
  // 開いたタブがPDFを読み込む時間を確保してからURLを解放する
  setTimeout(()=> URL.revokeObjectURL(url), 60000);
}

async function withLoading(fn){

  try{

      session = null; persistSession();

// チェックボックスの状態から変更点を集める。DOMがまだ生きている「クリックされた瞬間」に
// 同期的に呼び出すこと（withLoadingが読み込み中画面を表示してDOMを差し替えた後だと
// チェックボックスが消えてしまい、変更点を検出できなくなるため）。
function collectOrderChanges(){
  const changes = [];
  datesInPeriod(calendarYearMonth).forEach(d=>{
    if(isLocked(d) || isNonOrderableDay(d)) return; // 念のため締切済み・発注不可日は無視
    const checked = document.querySelector(`.calCheckbox[data-date="${d}"]:checked`);
    const menuId = checked ? checked.dataset.menu : null;
    const qtyInput = document.querySelector(`.calQtyInput[data-date="${d}"]`);
    const qty = Math.max(1, parseInt(qtyInput && qtyInput.value, 10) || 1);
    const existing = existingMenuFor(session.employeeId, d);
    const existingQty = existingQtyFor(session.employeeId, d);
    if(menuId){
      if(existing !== menuId || existingQty !== qty) changes.push({date:d, action:"place", menuId, qty});
    } else if(existing){
      changes.push({date:d, action:"cancel"});
    }
  });
  return changes;
}

async function placeBatchOrders(changes){
  let ordered = 0, cancelled = 0, failed = 0;
  for(const c of changes){
    try{
      if(c.action === "place"){
        await sbRpc("rpc_place_order", {p_token: session.token, p_date: c.date, p_menu_id: c.menuId, p_qty: c.qty || 1});
        if(!state.orders[c.date]) state.orders[c.date] = {};
        state.orders[c.date][session.employeeId] = { menuId: c.menuId, qty: c.qty || 1 };
        ordered++;
      } else {
        await sbRpc("rpc_cancel_order", {p_token: session.token, p_date: c.date});
        if(state.orders[c.date]) delete state.orders[c.date][session.employeeId];
        cancelled++;
      }
    }catch(e){
      failed++;
    }
  }
  const parts = [];
  if(ordered) parts.push(`${ordered}件を発注しました`);
  if(cancelled) parts.push(`${cancelled}件を取り消しました`);
  if(failed) parts.push(`${failed}件は失敗しました`);
  batchMessage = parts.length ? parts.join(" / ") : "変更はありませんでした";
}

// 対象者一覧の並び順（組織コード基準）。ヘッダークリックで昇順/降順を切り替え可能。
let empSortAsc = true;
function sortedEmployeesList(){
  return [...state.employees].sort((a,b)=>{
    const cmp = (a.orgCode||"").localeCompare(b.orgCode||"", "ja", {numeric:true});
    if(cmp !== 0) return empSortAsc ? cmp : -cmp;
    return (a.code||"").localeCompare(b.code||"", "ja", {numeric:true});
  });
}

      </div>
    </div>
    <div class="card">
      <h2>対象者一覧（${state.employees.length}名）</h2>
      <div class="hint">「組織コード」の見出しをクリックすると並び順（昇順⇔降順）を切り替えられます。左端のチェックボックスで複数選択し、下の「選択した対象者を削除」でまとめて削除できます。</div>

    renderEmployeesAdmin(container);
  };

  container.querySelector("#addEmpBtn").onclick = ()=>{
    const code = container.querySelector("#newEmpCode").value.trim();
    const name = container.querySelector("#newEmpName").value.trim();
    const dept = container.querySelector("#newEmpDept").value.trim();
    const orgCode = container.querySelector("#newEmpOrgCode").value.trim();
    const aggDept = container.querySelector("#newEmpAggDept").value.trim();
    const employeeType = container.querySelector("#newEmpType").value;
    const isAdmin = container.querySelector("#newEmpIsAdmin").checked;
    if(!name || !code){ alert("社員CDと氏名は必須です"); return; }
    withLoading(async ()=>{
      try{
        await sbRpc("rpc_admin_upsert_employee", {p_token: session.token, p_id: null, p_code: code, p_name: name, p_dept: dept, p_is_admin: isAdmin, p_org_code: orgCode, p_employee_type: employeeType, p_agg_dept: aggDept});
        const rows = await sbRpc("rpc_admin_list_employees", {p_token: session.token});
        state.employees = rows.map(mapEmployee);
      }catch(e){ alert(friendlyError(e)); }
    });
  };

  container.querySelectorAll("input[data-field]").forEach(inp=>{
    inp.onchange = ()=>{
      const emp = state.employees.find(x=>x.id===inp.dataset.id);
      if(!emp) return;
      const updated = Object.assign({}, emp, {[inp.dataset.field]: inp.value});
      withLoading(async ()=>{
        try{
          await sbRpc("rpc_admin_upsert_employee", {p_token: session.token, p_id: updated.id, p_code: updated.code, p_name: updated.name, p_dept: updated.dept, p_is_admin: updated.isAdmin, p_org_code: updated.orgCode||"", p_employee_type: updated.employeeType||"employee", p_agg_dept: updated.aggDept||""});
          const rows = await sbRpc("rpc_admin_list_employees", {p_token: session.token});
          state.employees = rows.map(mapEmployee);
        }catch(e){ alert(friendlyError(e)); }
      });
    };
  });

  container.querySelectorAll(".adminCheckbox").forEach(cb=>{
    cb.onchange = ()=>{
      const emp = state.employees.find(x=>x.id===cb.dataset.id);
      if(!emp) return;
      if(!cb.checked){
        const otherAdmins = state.employees.filter(e=>e.isAdmin && e.id!==emp.id).length;
        if(otherAdmins === 0){
          alert("最後の管理者アカウントの権限は外せません。先に別の管理者を設定してください。");
          cb.checked = true;
          return;
        }
      }
      const updated = Object.assign({}, emp, {isAdmin: cb.checked});
      withLoading(async ()=>{
        try{
          await sbRpc("rpc_admin_upsert_employee", {p_token: session.token, p_id: updated.id, p_code: updated.code, p_name: updated.name, p_dept: updated.dept, p_is_admin: updated.isAdmin, p_org_code: updated.orgCode||"", p_employee_type: updated.employeeType||"employee", p_agg_dept: updated.aggDept||""});
          const rows = await sbRpc("rpc_admin_list_employees", {p_token: session.token});
          state.employees = rows.map(mapEmployee);
        }catch(e){ alert(friendlyError(e)); }
      });
    };
  });

  container.querySelectorAll(".employeeTypeSelect").forEach(sel=>{
    sel.onchange = ()=>{
      const emp = state.employees.find(x=>x.id===sel.dataset.id);
      if(!emp) return;
      const updated = Object.assign({}, emp, {employeeType: sel.value});
      withLoading(async ()=>{
        try{
          await sbRpc("rpc_admin_upsert_employee", {p_token: session.token, p_id: updated.id, p_code: updated.code, p_name: updated.name, p_dept: updated.dept, p_is_admin: updated.isAdmin, p_org_code: updated.orgCode||"", p_employee_type: updated.employeeType||"employee", p_agg_dept: updated.aggDept||""});
          const rows = await sbRpc("rpc_admin_list_employees", {p_token: session.token});
          state.employees = rows.map(mapEmployee);
        }catch(e){ alert(friendlyError(e)); }
      });
    };
  });

  container.querySelectorAll("[data-del]").forEach(btn=>{
    btn.onclick = ()=>{
      if(!confirm("この対象者を削除しますか？")) return;
      withLoading(async ()=>{
        try{
          await sbRpc("rpc_admin_delete_employee", {p_token: session.token, p_id: btn.dataset.del});
          const rows = await sbRpc("rpc_admin_list_employees", {p_token: session.token});
          state.employees = rows.map(mapEmployee);
        }catch(e){ alert(friendlyError(e)); }
      });
    };
  });

  container.querySelector("#selectAllEmpCheckbox").onchange = (e)=>{
    container.querySelectorAll(".empSelectCheckbox").forEach(cb=>{ cb.checked = e.target.checked; });
  };

  container.querySelector("#bulkDeleteEmpBtn").onclick = ()=>{
    const selectedIds = Array.from(container.querySelectorAll(".empSelectCheckbox:checked")).map(cb=>cb.dataset.id);
    if(!selectedIds.length){ alert("削除する対象者を選択してください"); return; }
    // 選択した対象者を削除した結果、管理者が1人もいなくなる場合は誤操作防止のため中止する
    const remainingAdmins = state.employees.filter(e=> e.isAdmin && !selectedIds.includes(e.id)).length;
    if(remainingAdmins === 0){
      alert("選択した対象者を削除すると、管理者権限を持つ対象者が1人もいなくなります。先に他の対象者へ管理者権限を設定してから削除してください。");
      return;
    }
    if(!confirm(`選択した${selectedIds.length}件の対象者を削除しますか？この操作は取り消せません。`)) return;
    withLoading(async ()=>{
      let deleted = 0, failed = 0;
      for(const id of selectedIds){
        try{
          await sbRpc("rpc_admin_delete_employee", {p_token: session.token, p_id: id});
          deleted++;
        }catch(e){ failed++; }
      }
      const rows = await sbRpc("rpc_admin_list_employees", {p_token: session.token});
      state.employees = rows.map(mapEmployee);
      alert(`${deleted}件を削除しました${failed ? `（${failed}件は失敗しました）` : ""}`);
    });
  };

  container.querySelector("#csvInput").onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const lines = reader.result.split(/\r?\n/).map(l=>l.trim()).filter(l=>l);
      withLoading(async ()=>{
        let added = 0, updated = 0, skipped = 0;
        for(const line of lines){
          const parts = line.split(",").map(p=>p.trim());
          if(parts[0] === "社員CD" || parts[0] === "氏名" || parts[0] === "code") continue;
          const [code, name, dept, orgCode, typeRaw, aggDept] = parts;
          if(!code || !name) continue;
          // 社員CDが既存の対象者と一致する場合は、その対象者を上書き更新する（新規登録ではなく更新扱い）
          const existing = state.employees.find(x=>x.code===code);
          // CSVに組織コード・区分・集計用部署名の列が無い場合は、既存の値を保持する（誤って空欄で上書きしないため）
          const finalOrgCode = parts.length >= 4 ? (orgCode||"") : (existing ? (existing.orgCode||"") : "");
          let employeeType;
          if(parts.length >= 5){
            employeeType = "employee";
            if(typeRaw === "executive" || typeRaw === "役員") employeeType = "executive";
            else if(typeRaw === "dispatch" || typeRaw === "派遣") employeeType = "dispatch";
          } else {
            employeeType = existing ? existing.employeeType : "employee";
          }
          const finalAggDept = parts.length >= 6 ? (aggDept||"") : (existing ? (existing.aggDept||"") : "");
          try{
            await sbRpc("rpc_admin_upsert_employee", {
              p_token: session.token,
              p_id: existing ? existing.id : null,
              p_code: code,
              p_name: name,
              p_dept: dept||"",
              p_is_admin: existing ? existing.isAdmin : false,
              p_org_code: finalOrgCode,
              p_employee_type: employeeType,
              p_agg_dept: finalAggDept
            });
            if(existing) updated++; else added++;
          }catch(err){ skipped++; }
        }
        const rows = await sbRpc("rpc_admin_list_employees", {p_token: session.token});
        state.employees = rows.map(mapEmployee);
        alert(`${added}件を新規追加、${updated}件を更新しました${skipped ? `（${skipped}件は失敗しました）` : ""}`);
      });
    };
    reader.readAsText(file, "UTF-8");
  };

  container.querySelector("#csvExportBtn").onclick = ()=>{
    const csv = "社員CD,氏名,部署,組織コード,区分,集計用部署名\n" + state.employees.map(e=>`${e.code||""},${e.name},${e.dept},${e.orgCode||""},${e.employeeType||"employee"},${e.aggDept||""}`).join("\n");
    downloadFile("対象者リスト.csv", csv);
  };
}

// 所属（部署）の組織コード昇順、同じ部署内は氏名順に並べ替えたフラットな配列を返す
function sortReceiptRowsByDept(rows){
  const groupMap = new Map();
  rows.forEach(r=>{
    const key = r.dept || "(所属未設定)";
    if(!groupMap.has(key)) groupMap.set(key, { dept: key, orgCode: r.org_code || "", rows: [] });
    const g = groupMap.get(key);
    g.rows.push(r);
    const rOrg = r.org_code || "";
    if(rOrg && (!g.orgCode || rOrg.localeCompare(g.orgCode, "ja", {numeric:true}) < 0)) g.orgCode = rOrg;
  });
  const groups = [...groupMap.values()];
  groups.sort((a,b)=> (a.orgCode||"").localeCompare(b.orgCode||"", "ja", {numeric:true}));
  groups.forEach(g=> g.rows.sort((a,b)=> a.name.localeCompare(b.name,"ja")));
  const flat = [];
  groups.forEach(g=> g.rows.forEach(r=> flat.push(r)));
  return flat;
}

/* --- 月次集計（21日〜20日の発注月度でExcel出力。日付ごとの発注金額・数量が分かる明細形式＋部署別・メニュー別集計） --- */
let monthlyYm = periodLabelFor(todayStr());
let monthlyGroups = []; // 集計後: [{code, name, total, byDate: {date: amount}}]
let monthlyMenuTotals = []; // 集計後: [{menuName, totalQty, totalAmount}]
let monthlyMenuBreakdown = []; // 集計後: [{menuId, menuName, totalQty, totalAmount, employees: [{code,name,totalQty,totalAmount}]}]

// 日付を「M/D」形式の短い表示にする（列見出し用）
function fmtDateShort(dateStr){
  const [, mo, da] = dateStr.split("-").map(Number);
  return `${mo}/${da}`;
}

// 期間内の生の発注データ（社員別・個人単価反映済みのamountを含む）を社員ごとにグループ化し、
// 日付ごとの金額を横持ち（列）で参照できる形にする（A:社員CD B:氏名 C:月間数量 D:月間発注金額 E列以降:日付別金額）
function aggregateOrdersByEmployeeDate(rawRows){
  const map = new Map();
  rawRows.forEach(r=>{
    if(!map.has(r.employee_id)) map.set(r.employee_id, { code: r.code, name: r.name, dept: r.dept||"", aggDept: r.agg_dept||"", total: 0, totalQty: 0, byDate: {}, byMenu: {} });
    const g = map.get(r.employee_id);
    g.byDate[r.date] = (g.byDate[r.date] || 0) + (r.amount || 0);
    g.byMenu[r.menu_id] = (g.byMenu[r.menu_id] || 0) + (r.qty || 1);
    g.total += (r.amount || 0);
    g.totalQty += (r.qty || 1);
  });
  const groups = [...map.values()];
  groups.sort((a,b)=> (a.code||"").localeCompare(b.code||"", "ja", {numeric:true}));
  return groups;
}

// 社員別集計を「集計用部署名」ごとにまとめ、グループ単位の月間合計数量・合計金額（メニュー別数量を含む）を算出する
// （集計用部署名が未設定の対象者は部署別集計には含めない）
function aggregateDeptTotals(groups){
  const map = new Map();
  groups.filter(g=> g.aggDept).forEach(g=>{
    const key = g.aggDept;
    if(!map.has(key)) map.set(key, { dept: key, totalQty: 0, totalAmount: 0, byMenu: {} });
    const d = map.get(key);
    d.totalQty += g.totalQty;
    d.totalAmount += g.total;
    Object.keys(g.byMenu||{}).forEach(menuId=>{
      d.byMenu[menuId] = (d.byMenu[menuId] || 0) + g.byMenu[menuId];
    });
  });
  return [...map.values()].sort((a,b)=> a.dept.localeCompare(b.dept, "ja"));
}

// 期間内の生の発注データをメニューごとにまとめ、メニュー単位の月間合計数量・合計金額を算出する
function aggregateMenuTotals(rawRows){
  const map = new Map();
  rawRows.forEach(r=>{
    const key = r.menu_id;
    if(!map.has(key)) map.set(key, { menuName: r.menu_name||"", totalQty: 0, totalAmount: 0 });
    const g = map.get(key);
    g.totalQty += (r.qty || 1);
    g.totalAmount += (r.amount || 0);
  });
  return [...map.values()].sort((a,b)=> a.menuName.localeCompare(b.menuName, "ja"));
}

// 期間内の生の発注データを「メニュー→社員」の2段階でまとめ、メニューごとにシートを分けて出力するための detail データを作る
// [{menuId, menuName, totalQty, totalAmount, employees:[{code,name,totalQty,totalAmount}]}]
function aggregateMenuEmployeeBreakdown(rawRows){
  const menuMap = new Map();
  rawRows.forEach(r=>{
    if(!menuMap.has(r.menu_id)){
      menuMap.set(r.menu_id, { menuId: r.menu_id, menuName: r.menu_name||"", empMap: new Map(), totalQty: 0, totalAmount: 0 });
    }
    const menuEntry = menuMap.get(r.menu_id);
    if(!menuEntry.empMap.has(r.employee_id)){
      menuEntry.empMap.set(r.employee_id, { code: r.code, name: r.name, aggDept: r.agg_dept||"", totalQty: 0, totalAmount: 0 });
    }
    const empEntry = menuEntry.empMap.get(r.employee_id);
    empEntry.totalQty += (r.qty || 1);
    empEntry.totalAmount += (r.amount || 0);
    menuEntry.totalQty += (r.qty || 1);
    menuEntry.totalAmount += (r.amount || 0);
  });
  const menus = [...menuMap.values()].map(m=>({
    menuId: m.menuId,
    menuName: m.menuName,
    totalQty: m.totalQty,
    totalAmount: m.totalAmount,
    employees: [...m.empMap.values()].sort((a,b)=> (a.code||"").localeCompare(b.code||"", "ja", {numeric:true}))
  }));
  menus.sort((a,b)=> a.menuName.localeCompare(b.menuName, "ja"));
  return menus;
}

// あるメニューを発注した対象者一覧（各要素に aggDept, totalQty, totalAmount を持つ）を
// 「集計用部署名」でまとめ、そのメニュー内での部署別月間合計数量・金額を算出する
// （集計用部署名が未設定の対象者は部署別集計には含めない。全体の部署別集計と同じルール）
function aggregateMenuDeptTotals(employees){
  const map = new Map();
  employees.filter(e=> e.aggDept).forEach(e=>{
    const key = e.aggDept;
    if(!map.has(key)) map.set(key, { dept: key, totalQty: 0, totalAmount: 0 });
    const d = map.get(key);
    d.totalQty += e.totalQty;
    d.totalAmount += e.totalAmount;
  });
  return [...map.values()].sort((a,b)=> a.dept.localeCompare(b.dept, "ja"));
}

// 月次集計をA4縦向き・表形式のExcelファイル(.xlsx)として出力する
// （メイン集計シート: 社員別内訳を左右2列に分けて表示し、その下に部署別・メニュー別集計をまとめる。
//   さらにメニューごとに、そのメニューを発注した対象者一覧をまとめた専用シートを追加する）
async function exportMonthlyExcel({ monthlyYm, monthlyGroups, deptTotals, menuTotals, menuBreakdown, menuList, grandTotal, grandTotalQty }){
  const menus = menuList||[];
  const wb = new ExcelJS.Workbook();

  // 日本語がどの環境でも文字化け・表示崩れなく表示されるよう、全セル共通のフォントを明示的に指定する
  const JP_FONT = "游ゴシック";
  const styleHeaderRow = (row, skipCols)=>{
    row.eachCell((cell, colNumber)=>{
      if(skipCols && skipCols.has(colNumber)) return;
      cell.font = { name: JP_FONT, size: 11, bold:true };
      cell.alignment = { horizontal:"center", vertical:"middle" };
      cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb:"FFEFEFEF"} };
      cell.border = { top:{style:"thin"}, left:{style:"thin"}, bottom:{style:"thin"}, right:{style:"thin"} };
    });
  };
  const styleDataRow = (row, boldTotal, skipCols)=>{
    row.eachCell((cell, colNumber)=>{
      if(skipCols && skipCols.has(colNumber)) return;
      cell.font = { name: JP_FONT, size: 11, bold: !!boldTotal };
      cell.alignment = { vertical:"middle" };
      cell.border = { top:{style:"thin"}, left:{style:"thin"}, bottom:{style:"thin"}, right:{style:"thin"} };
    });
  };

  // 列幅は固定値ではなく、実際に入っている文字（全角・半角）の見た目の幅から自動計算する。
  // これにより、氏名・集計用部署名・メニュー名が長い場合や、金額の桁数が多い場合でも
  // 文字が「###」表示になったり、枠内で見切れたりしないようにする。
  function displayWidth(str){
    let w = 0;
    for(const ch of String(str)){
      w += /[　-鿿＀-￯]/.test(ch) ? 2 : 1; // 全角相当は2、半角は1として計算
    }
    return w;
  }
  function autoFitColumns(sheet, excludeRowNumbers){
    const excludeSet = excludeRowNumbers || new Set();
    const colWidths = {};
    sheet.eachRow(row=>{
      if(excludeSet.has(row.number)) return; // 結合された見出し行は列幅計算から除外
      row.eachCell({ includeEmpty:false }, (cell, colNumber)=>{
        const v = cell.value;
        if(v == null || v === "") return;
        let display;
        if(typeof v === "number" && cell.numFmt && cell.numFmt.indexOf("¥") !== -1){
          display = "¥" + v.toLocaleString();
        } else {
          display = String(v);
        }
        const w = displayWidth(display);
        if(!colWidths[colNumber] || w > colWidths[colNumber]) colWidths[colNumber] = w;
      });
    });
    Object.keys(colWidths).forEach(colNumber=>{
      sheet.getColumn(Number(colNumber)).width = Math.min(Math.max(colWidths[colNumber] + 4, 10), 40);
    });
  }

  // Excelのシート名は最大31文字・使用不可文字（\/?*[]:）ありのため、メニュー名から安全なシート名を作る
  const usedSheetNames = new Set();
  function safeSheetName(name){
    let s = String(name || "メニュー").replace(/[\\\/\?\*\[\]:]/g, "");
    if(!s) s = "メニュー";
    if(s.length > 31) s = s.slice(0, 31);
    let finalName = s;
    let counter = 2;
    while(usedSheetNames.has(finalName)){
      const suffix = `(${counter})`;
      finalName = s.slice(0, Math.max(1, 31 - suffix.length)) + suffix;
      counter++;
    }
    usedSheetNames.add(finalName);
    return finalName;
  }

  const ws = wb.addWorksheet(safeSheetName("月次集計"), {
    pageSetup: { paperSize: 9, orientation: "portrait", fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: {left:0.5,right:0.5,top:0.5,bottom:0.5,header:0.2,footer:0.2} }
  });

  // 社員別内訳を左右2列に分けて表示する（各列: 社員CD,氏名,月間数量,月間発注金額,メニュー別数量…／間に空白列）
  const blockWidth = 4 + menus.length; // 1ブロックの列数
  const gapCol = blockWidth + 1;
  const rightStart = gapCol + 1;
  const leftAmountCol = 4;
  const rightAmountCol = rightStart + 3;

  const half = Math.ceil(monthlyGroups.length / 2);
  const leftGroups = monthlyGroups.slice(0, half);
  const rightGroups = monthlyGroups.slice(half);

  const menuNameCells = menus.map(mn=>mn.name);
  const h1 = ws.addRow(["社員CD","氏名","月間数量","月間発注金額", ...menuNameCells, "", "社員CD","氏名","月間数量","月間発注金額", ...menuNameCells]);
  styleHeaderRow(h1, new Set([gapCol]));

  const empRowCount = Math.max(leftGroups.length, rightGroups.length);
  for(let i=0;i<empRowCount;i++){
    const l = leftGroups[i];
    const r = rightGroups[i];
    const leftMenuQtys = menus.map(mn=> l ? ((l.byMenu && l.byMenu[mn.id]) || 0) : "");
    const rightMenuQtys = menus.map(mn=> r ? ((r.byMenu && r.byMenu[mn.id]) || 0) : "");
    const row = ws.addRow([
      l ? (l.code||"") : "", l ? l.name : "", l ? l.totalQty : "", l ? l.total : "", ...leftMenuQtys,
      "",
      r ? (r.code||"") : "", r ? r.name : "", r ? r.totalQty : "", r ? r.total : "", ...rightMenuQtys
    ]);
    styleDataRow(row, false, new Set([gapCol]));
    row.getCell(leftAmountCol).numFmt = "¥#,##0";
    row.getCell(rightAmountCol).numFmt = "¥#,##0";
  }

  const totalRowValues = ["合計","", grandTotalQty, grandTotal, ...menus.map(mn=> monthlyGroups.reduce((s,g)=> s + ((g.byMenu && g.byMenu[mn.id])||0), 0))];
  const totalRow = ws.addRow(totalRowValues);
  ws.mergeCells(totalRow.number, 1, totalRow.number, 2);
  styleDataRow(totalRow, true);
  totalRow.getCell(leftAmountCol).numFmt = "¥#,##0";

  // 3行あける
  ws.addRow([]); ws.addRow([]); ws.addRow([]);

  const deptTitleRow = ws.addRow(["集計用部署名別 月間合計数量・金額"]);
  ws.mergeCells(deptTitleRow.number, 1, deptTitleRow.number, 3 + menus.length);
  deptTitleRow.font = { name: JP_FONT, bold:true, size:13 };

  const deptHeaderRow = ws.addRow(["集計用部署名","月間合計数量","月間合計金額", ...menuNameCells]);
  styleHeaderRow(deptHeaderRow);

  deptTotals.forEach(d=>{
    const row = ws.addRow([d.dept, d.totalQty, d.totalAmount, ...menus.map(mn=> (d.byMenu && d.byMenu[mn.id]) || 0)]);
    styleDataRow(row, false);
    row.getCell(3).numFmt = "¥#,##0";
  });
  const deptTotalRow = ws.addRow(["合計", grandTotalQty, grandTotal, ...menus.map(mn=> deptTotals.reduce((s,d)=> s + ((d.byMenu && d.byMenu[mn.id])||0), 0))]);
  styleDataRow(deptTotalRow, true);
  deptTotalRow.getCell(3).numFmt = "¥#,##0";

  // 3行あける
  ws.addRow([]); ws.addRow([]); ws.addRow([]);

  const menuTitleRow = ws.addRow(["メニュー別 月間合計数量・金額"]);
  ws.mergeCells(menuTitleRow.number, 1, menuTitleRow.number, 3);
  menuTitleRow.font = { name: JP_FONT, bold:true, size:13 };

  const menuHeaderRow = ws.addRow(["メニュー","月間合計数量","月間合計金額"]);
  styleHeaderRow(menuHeaderRow);

  (menuTotals||[]).forEach(mt=>{
    const row = ws.addRow([mt.menuName, mt.totalQty, mt.totalAmount]);
    styleDataRow(row, false);
    row.getCell(3).numFmt = "¥#,##0";
  });
  const menuTotalRow = ws.addRow(["合計", grandTotalQty, grandTotal]);
  styleDataRow(menuTotalRow, true);
  menuTotalRow.getCell(3).numFmt = "¥#,##0";

  const titleRowNumbers = new Set([deptTitleRow.number, menuTitleRow.number]);
  autoFitColumns(ws, titleRowNumbers);
  // 間の空白列は社員別内訳の左右2列を区切るための列（常に狭い固定幅にする）
  ws.getColumn(gapCol).width = 3;

  // メニューごとに、そのメニューを発注した対象者一覧（個人別）＋集計用部署名別の集計をまとめたシートを追加する
  (menuBreakdown||[]).forEach(menu=>{
    const mws = wb.addWorksheet(safeSheetName(menu.menuName), {
      pageSetup: { paperSize: 9, orientation: "portrait", fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: {left:0.5,right:0.5,top:0.5,bottom:0.5,header:0.2,footer:0.2} }
    });
    const titleRow = mws.addRow([`${menu.menuName}　発注者一覧（${monthlyYm}）`]);
    mws.mergeCells(titleRow.number, 1, titleRow.number, 4);
    titleRow.font = { name: JP_FONT, bold:true, size:13 };

    const mHeaderRow = mws.addRow(["社員CD","氏名","数量","金額"]);
    styleHeaderRow(mHeaderRow);

    menu.employees.forEach(emp=>{
      const row = mws.addRow([emp.code||"", emp.name, emp.totalQty, emp.totalAmount]);
      styleDataRow(row, false);
      row.getCell(4).numFmt = "¥#,##0";
    });
    const mTotalRow = mws.addRow(["合計","", menu.totalQty, menu.totalAmount]);
    mws.mergeCells(mTotalRow.number, 1, mTotalRow.number, 2);
    styleDataRow(mTotalRow, true);
    mTotalRow.getCell(4).numFmt = "¥#,##0";

    // 3行あける
    mws.addRow([]); mws.addRow([]); mws.addRow([]);

    const menuDeptTotals = aggregateMenuDeptTotals(menu.employees);
    const mDeptTitleRow = mws.addRow(["集計用部署名別 集計"]);
    mws.mergeCells(mDeptTitleRow.number, 1, mDeptTitleRow.number, 3);
    mDeptTitleRow.font = { name: JP_FONT, bold:true, size:13 };

    const mDeptHeaderRow = mws.addRow(["集計用部署名","数量","金額"]);
    styleHeaderRow(mDeptHeaderRow);

    menuDeptTotals.forEach(d=>{
      const row = mws.addRow([d.dept, d.totalQty, d.totalAmount]);
      styleDataRow(row, false);
      row.getCell(3).numFmt = "¥#,##0";
    });
    const mDeptTotalRow = mws.addRow(["合計", menu.totalQty, menu.totalAmount]);
    styleDataRow(mDeptTotalRow, true);
    mDeptTotalRow.getCell(3).numFmt = "¥#,##0";

    autoFitColumns(mws, new Set([titleRow.number, mDeptTitleRow.number]));
  });

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  downloadBlob(`月次発注金額集計_${monthlyYm}.xlsx`, blob);
}

// 社員CD・氏名・部署・集計用部署名のいずれかに検索語を含む対象者かどうかを判定する
function employeeMatchesSearch(emp, term){
  if(!term) return true;
  const t = term.toLowerCase();
  return (emp.code||"").toLowerCase().includes(t)
    || (emp.name||"").toLowerCase().includes(t)
    || (emp.dept||"").toLowerCase().includes(t)
    || (emp.aggDept||"").toLowerCase().includes(t);
}

      <label>対象者を検索（社員CD・氏名・部署・集計用部署名）</label>
      <input type="text" id="proxyEmpSearch" placeholder="例: 221323、神林、総務課" value="${proxySearchTerm}">
      <label style="margin-top:8px;">対象者<span id="proxyEmpCountLabel">${proxySearchTerm ? `（${visibleEmployees.length}件ヒット）` : ""}</span></label>
      <select id="proxyEmpSelect">
        ${visibleEmployees.length ? visibleEmployees.map(e=>`<option value="${e.id}" ${e.id===proxyEmployeeId?"selected":""}>${e.code||""} ${e.name}${e.dept?`（${e.dept}）`:""}</option>`).join("") : `<option value="">該当する対象者がいません</option>`}
      </select>
    </div>
    <div class="card no-print">
      <h2>対象月度</h2>
      <div class="row" style="align-items:center;">
        <button class="secondary" id="proxyPrevBtn" style="flex:0 0 auto;">← 前月度</button>
        <input type="month" id="proxyMonthSelect" value="${proxyYm}">
        <button class="secondary" id="proxyNextBtn" style="flex:0 0 auto;">次月度 →</button>
      </div>
    </div>
    <div class="card">
      <h2>${ymYear}年${Number(ymMonth)}月度（${fmtDateJP(periodStart)}〜${fmtDateJP(periodEnd)}）${targetEmp ? ` — ${targetEmp.name}` : ""}</h2>
      <div class="table-scroll">
      <table>
        <tr>
          <th>日付</th><th>状態</th>
          ${state.menu.map(m=>`<th>${m.name}<br><span class="hint" style="margin:0;">¥${priceForTarget(m)}</span></th>`).join("")}
          <th>数量</th>
        </tr>
        ${dates.map(d=>{
          const holiday = holidayName(d);
          const blockedDate = isBlockedDate(d);
          const blockedWd = isBlockedWeekday(d);
          const nonOrderable = blockedDate || blockedWd || !!holiday;
          const existing = proxyEmployeeId ? existingMenuFor(proxyEmployeeId, d) : null;
          const existingQty = proxyEmployeeId ? existingQtyFor(proxyEmployeeId, d) : 1;
          const existingMenuName = existing ? (state.menu.find(m=>m.id===existing)?.name || "―") : null;
          const existingLabel = existingMenuName ? (existingQty > 1 ? `${existingMenuName} ×${existingQty}` : existingMenuName) : null;
          const isToday = d === todayStr();
          const todayCls = isToday ? " row-today" : "";
          const todayMark = isToday ? ` <span class="today-badge">本日</span>` : "";
          if(nonOrderable){
            const label = holiday ? holiday : (blockedWd ? `${WEEKDAY_LABELS[dayOfWeek(d)]}曜休配` : "発注不可日");
            return `<tr class="row-holiday${todayCls}">
              <td>${fmtDateJP(d)}${todayMark}</td>
              <td><span style="color:var(--sub);">休（${label}）</span></td>
              <td colspan="${state.menu.length+1}">${existingLabel ? existingLabel : "発注不可"}</td>
            </tr>`;
          }
          const lockedNote = isLocked(d) ? ` <span class="hint" style="margin:0;color:var(--lock);">(通常締切後)</span>` : "";
          return `<tr class="${todayCls.trim()}">
            <td>${fmtDateJP(d)}${todayMark}</td>
            <td><span style="color:var(--ok);">修正可</span>${lockedNote}</td>
            ${state.menu.map(m=>`
              <td class="checkbox-col" style="width:auto;text-align:center;">
                <input type="checkbox" class="proxyCheckbox" data-date="${d}" data-menu="${m.id}" ${existing===m.id?"checked":""}>
              </td>`).join("")}
            <td class="checkbox-col" style="width:56px;">
              <input type="number" class="proxyQtyInput" data-date="${d}" min="1" value="${existing ? existingQty : ""}" style="width:52px;padding:4px;">
            </td>
          </tr>`;
        }).join("")}
      </table>
      </div>
      <div class="hint">「(通常締切後)」と表示されている日付も、この画面からは登録・修正・取消ができます。</div>
      <button class="primary" id="proxyUpdateBtn">まとめて更新する</button>
      ${proxyMessage ? `<div class="status-box status-ok">${proxyMessage}</div>` : ""}
    </div>
  `;

  // 検索欄の入力ではコンテナ全体を再描画しない（日本語入力（IME）変換中に要素が作り直されると、
  // 「ささき」が「ｓあｓあｋい」のように文字化けする不具合が起きるため）。
  // 代わりにプルダウンの選択肢と件数表示だけをその場で更新する。
  container.querySelector("#proxyEmpSearch").oninput = (e)=>{
    proxySearchTerm = e.target.value;
    const filtered = employees.filter(emp=> employeeMatchesSearch(emp, proxySearchTerm) || emp.id === proxyEmployeeId);
    const select = container.querySelector("#proxyEmpSelect");
    select.innerHTML = filtered.length
      ? filtered.map(emp=>`<option value="${emp.id}" ${emp.id===proxyEmployeeId?"selected":""}>${emp.code||""} ${emp.name}${emp.dept?`（${emp.dept}）`:""}</option>`).join("")
      : `<option value="">該当する対象者がいません</option>`;
    container.querySelector("#proxyEmpCountLabel").textContent = proxySearchTerm ? `（${filtered.length}件ヒット）` : "";
  };
  container.querySelector("#proxyEmpSelect").onchange = (e)=>{
    if(!e.target.value) return;
    proxyEmployeeId = e.target.value;
    proxyMessage = "";
    withLoading(()=> loadProxyOrdersForPeriod(proxyEmployeeId, proxyYm));
  };
  container.querySelector("#proxyMonthSelect").onchange = (e)=>{
    if(e.target.value) proxyYm = e.target.value;
    proxyMessage = "";
    withLoading(()=> loadProxyOrdersForPeriod(proxyEmployeeId, proxyYm));
  };
  container.querySelector("#proxyPrevBtn").onclick = ()=>{
    proxyYm = shiftMonth(proxyYm, -1);
    proxyMessage = "";
    withLoading(()=> loadProxyOrdersForPeriod(proxyEmployeeId, proxyYm));
  };
  container.querySelector("#proxyNextBtn").onclick = ()=>{
    proxyYm = shiftMonth(proxyYm, 1);
    proxyMessage = "";
    withLoading(()=> loadProxyOrdersForPeriod(proxyEmployeeId, proxyYm));
  };

  // 同じ日で他のメニューにチェックが入ったら自動的に他を外す。チェックを入れたら数量に1を初期値として入れ、
  // その日のチェックが全て外れたら数量を空欄に戻す（発注タブと同じ挙動）。
  container.querySelectorAll(".proxyCheckbox").forEach(cb=>{
    cb.onchange = ()=>{
      const qtyInput = container.querySelector(`.proxyQtyInput[data-date="${cb.dataset.date}"]`);
      if(cb.checked){
        container.querySelectorAll(`.proxyCheckbox[data-date="${cb.dataset.date}"]`).forEach(other=>{
          if(other !== cb) other.checked = false;
        });
        if(qtyInput && !qtyInput.value) qtyInput.value = "1";
      } else {
        const stillChecked = container.querySelector(`.proxyCheckbox[data-date="${cb.dataset.date}"]:checked`);
        if(!stillChecked && qtyInput) qtyInput.value = "";
      }
    };
  });

  container.querySelector("#proxyUpdateBtn").onclick = ()=>{
    const empId = proxyEmployeeId;
    const changes = collectProxyOrderChanges(empId, proxyYm); // DOMが生きているうちに同期的に取得
    withLoading(()=> placeProxyBatchOrders(empId, changes));
  };
}

// 代理発注画面のチェックボックスの状態から変更点を集める（締切は無視するが、休配日・発注不可日は対象外）
function collectProxyOrderChanges(employeeId, periodYm){
  const changes = [];
  datesInPeriod(periodYm).forEach(d=>{
    if(isNonOrderableDay(d)) return;
    const checked = document.querySelector(`.proxyCheckbox[data-date="${d}"]:checked`);
    const menuId = checked ? checked.dataset.menu : null;
    const qtyInput = document.querySelector(`.proxyQtyInput[data-date="${d}"]`);
    const qty = Math.max(1, parseInt(qtyInput && qtyInput.value, 10) || 1);
    const existing = existingMenuFor(employeeId, d);
    const existingQty = existingQtyFor(employeeId, d);
    if(menuId){
      if(existing !== menuId || existingQty !== qty) changes.push({date:d, action:"place", menuId, qty});
    } else if(existing){
      changes.push({date:d, action:"cancel"});
    }
  });
  return changes;
}

async function placeProxyBatchOrders(employeeId, changes){
  let ordered = 0, cancelled = 0, failed = 0;
  for(const c of changes){
    try{
      if(c.action === "place"){
        await sbRpc("rpc_admin_place_order_for", {p_token: session.token, p_employee_id: employeeId, p_date: c.date, p_menu_id: c.menuId, p_qty: c.qty || 1});
        if(!state.orders[c.date]) state.orders[c.date] = {};
        state.orders[c.date][employeeId] = { menuId: c.menuId, qty: c.qty || 1 };
        ordered++;
      } else {
        await sbRpc("rpc_admin_cancel_order_for", {p_token: session.token, p_employee_id: employeeId, p_date: c.date});
        if(state.orders[c.date]) delete state.orders[c.date][employeeId];
        cancelled++;
      }
    }catch(e){
      failed++;
    }
  }
  const parts = [];
  if(ordered) parts.push(`${ordered}件を登録・修正しました`);
  if(cancelled) parts.push(`${cancelled}件を取り消しました`);
  if(failed) parts.push(`${failed}件は失敗しました`);
  proxyMessage = parts.length ? parts.join(" / ") : "変更はありませんでした";
}

/* ===================== 時計 ===================== */
function updateClock(){
  const now = new Date();
  document.getElementById("clockDisplay").textContent =
    `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
}
updateClock();
setInterval(updateClock, 30000);

/* ===================== 初期起動 ===================== */
async function boot(){
  await withLoading(async ()=>{
    await loadMenu();
    session = loadStoredSession();
    if(session){
      await loadSettings();
      await loadMyOrdersForMonth(calendarYearMonth);
    }
  });
}
boot();
</script>
